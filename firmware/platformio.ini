; Jenix lock bridge firmware — ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB OPI PSRAM).
;
; Stage 1 (this firmware): a BLE-central <-> USB-serial bridge. The ESP32-S3
; scans/connects to the lock over BLE and relays GATT traffic to/from the PC
; over the CH343 USB-UART bridge, so the desktop client can drive the real lock
; through the board. Stage 2 adds the Wi-Fi REST API.
;
; Board USB is a CH343 UART bridge (not native USB), so Serial is UART0 and
; ARDUINO_USB_CDC_ON_BOOT is disabled.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM39
monitor_port = COM39
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-WROOM-1 N16R8: 16MB QIO flash + 8MB octal (OPI) PSRAM.
; The base board def is N8/no-PSRAM, so override flash size, memory type and
; the partition table for the full 16MB.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSERIAL_BRIDGE_BAUD=115200

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.0
